<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo_da_pagina }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1> TaskIA </h1>
    <form method="POST">
        <input type="text" id="tituloTarefa" name="tituloTarefa">
        <input type="date" id="dataConclusao" name="dataConclusao">
        <button type="submit" onclick="adicionarTarefa()">
            {{ button_submit }}
        </button>
        <a href="/" class="botao-voltar" style="{{ botao_voltar }}">
        <span class="botao-voltar__icone" aria-hidden="true">←</span>
        <span>Voltar para tarefas</span>
</a>
      
    </form>
    
    <ul id="listaTarefas" style="{{ lista }}">
        {% for tarefa in tarefas_da_pagina %}
            <li>
                {{ tarefa.titulo_tarefa }} - {{ tarefa.data_conclusao }}
                <a href="/delete/{{ tarefa.id_tarefa }}">Apagar</a>
                <a href="/edit/{{ tarefa.id_tarefa }}">Editar</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
